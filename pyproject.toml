[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-pendulum-rl"
version = "0.1.0"
description = "Reinforcement learning for drone-mounted double pendulum stabilization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mujoco",
    "gymnasium",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]