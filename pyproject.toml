
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-pendulum-rl"
version = "0.1.0"
description = "Reinforcement learning for drone-mounted double pendulum stabilization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "mujoco==3.3.7",
    "gymnasium>=0.29.1,<1.1",
    "torch==2.2.2",
    "stable-baselines3==2.4.1",
    "moviepy",
    "pytest",
    "tensorboard",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_pendulum = [
    "simulation/assets/*.xml",
    "starling_simulation/assets/*.xml",
    "starling_simulation/assets/assets/*",
]
