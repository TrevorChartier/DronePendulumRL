
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-pendulum-rl"
version = "0.1.0"
description = "Reinforcement learning for drone-mounted double pendulum stabilization"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "mujoco==3.3.7",
    "gymnasium>=0.29.1,<1.1",
    "torch==2.2.2",
    "moviepy",
    "pytest",
    "tensorboard",
    "scipy>=1.15.3",
    "matplotlib>=3.10.9",
    "imageio>=2.38.0",
    "imageio-ffmpeg>=0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_pendulum = [
    "simulation/assets/*.xml",
    "simulation/assets/meshes/*.STL",
    "starling_simulation/assets/*.xml",
    "starling_simulation/assets/assets/*",
]
